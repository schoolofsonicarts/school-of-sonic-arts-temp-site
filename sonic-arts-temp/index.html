<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SSA x METHEXIS — Open Call</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500&family=Spectral:ital,wght@0,200;0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --anechoic: #080B14;
    --bone: #EDE9E0;
    --grain: #7C8598;
    --pink: #FF2A7A;
    --hair-soft: rgba(237,233,224,.07);

    --display: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
    --text: 'Spectral', Georgia, 'Times New Roman', serif;
    --util: 'IBM Plex Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background-color: var(--anechoic);
    color: var(--bone);
    font-family: var(--text);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  ::selection { background: var(--pink); color: var(--anechoic); }
  a { color: inherit; text-decoration: none; transition: 0.3s ease; }

  /* --- CINEMATIC BACKGROUND --- */
  #cymatics-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 0;
  }

  /* Dark Vignette, smooth and clean now that the static grain is gone */
  .vignette {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background: radial-gradient(circle at center, rgba(8, 11, 20, 0.35) 0%, rgba(8, 11, 20, 0.95) 100%);
  }

  /* --- LAYOUT ARCHITECTURE --- */
  .ui-layer {
    position: relative;
    z-index: 10;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: clamp(30px, 5vw, 60px) clamp(30px, 6vw, 80px);
    pointer-events: none;
    mix-blend-mode: screen; /* This turns all pure black inside it into transparent windows */
  }

  .ui-layer > * { pointer-events: auto; }

  header svg { width: clamp(50px, 6vw, 70px); height: auto; color: var(--bone); }

  main {
    max-width: 900px;
    margin: auto; /* Centers the block vertically and horizontally */
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  h1 {
    font-family: var(--display);
    font-weight: 800;
    font-variation-settings: "wdth" 118, "wght" 800;
    font-size: clamp(2.5rem, 3.5vw, 3.5rem);
    line-height: 1.1;
    letter-spacing: -0.02em;
    margin: 12px 0 20px 0;

    background-color: var(--pink);
    color: #000000;
    padding: 6px 20px 10px 20px;
    border-radius: 2px;
  }

  /* The lowercase 'x' styling */
  h1 span.x {
    font-weight: 500;
    font-size: 0.75em;
    vertical-align: middle;
    text-transform: lowercase;
    color: #000000; /* Must be black to punch through the pink box */
  }

  h2 {
    font-family: var(--util);
    font-weight: 400;
    font-size: clamp(14px, 1.8vw, 20px);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--bone);
    margin-bottom: 0px;
  }

  p.deadline {
    font-family: var(--util);
    font-size: clamp(11px, 1.2vw, 13px);
    letter-spacing: 0.1em;
    color: var(--grain);
    margin-bottom: 48px;
    text-transform: uppercase;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 28px;
    border-radius: 1px;
    font-family: var(--util);
    font-size: 0.7rem;
    letter-spacing: 0.17em;
    text-transform: uppercase;
    border: 1px solid rgba(237, 233, 224, 0.2);
    background: transparent;
    color: var(--bone);
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .btn:hover {
    border-color: var(--pink);
    background: var(--pink);
    color: var(--anechoic);
  }

  footer {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    font-family: var(--util);
    font-size: 0.685rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }

  .f-col { display: flex; flex-direction: column; gap: 8px; }
  .f-col span { color: var(--grain); margin-bottom: 2px; font-size: 0.6rem; }
  .f-col a:hover { color: var(--pink); }

  /* Force email addresses to render in lowercase */
  footer a[href^="mailto"] {
    text-transform: lowercase;
  }

  .social svg { width: 18px; height: 18px; transition: 0.3s ease; margin-top: 4px; }
  .social:hover svg { color: var(--pink); transform: scale(1.1); }

  @media (max-width: 768px) {
    footer { flex-direction: column; align-items: flex-start; gap: 30px; }
  }
</style>
</head>
<body>

<canvas id="cymatics-canvas"></canvas>
<div class="vignette"></div>

<div class="ui-layer">
  <header>
    <a href="#" aria-label="School of Sonic Arts">
      <!-- Provide the path to your official SVG logo in the src attribute -->
      <img src="Logo.svg" alt="School of Sonic Arts" style="height: clamp(55px, 8vw, 90px); width: auto;">
    </a>
  </header>

  <main>
    <h2>Call for Electronic Work</h2>
    <h1>SSA <span class="x">x</span> METHEXIS</h1>
    <p class="deadline">(submission deadline Oct 1. 2026)</p>
    <a href="https://www.instagram.com/p/DbD10dXkV0J/?igsh=MXZ0cGh2dzkwOWx0NA==" target="_blank" class="btn">More Info</a>
  </main>

  <footer>
    <div class="f-col">
      <span>Contact</span>
      <a href="mailto:info@schoolofsonicarts.com">info@schoolofsonicarts.com</a>
    </div>
    <div class="f-col">
      <span>Social</span>
      <a href="https://www.instagram.com/schoolofsonicarts" target="_blank" class="social" aria-label="Instagram">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
          <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
          <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
        </svg>
      </a>
    </div>
  </footer>
</div>

<script>
  const cv = document.getElementById('cymatics-canvas');
  const ctx = cv.getContext('2d', {alpha: false});
  let W, H, dpr;

  const N = window.innerWidth < 700 ? 10000 : 20000; // Dense, full-screen dust texture
  const px = new Float32Array(N);
  const py = new Float32Array(N);
  const vx = new Float32Array(N);
  const vy = new Float32Array(N);
  const pz = new Float32Array(N); // Depth: 0.6 (close) .. 1.5 (far) — drives parallax
  const lx = new Float32Array(N);
  const ly = new Float32Array(N);
  const isLogo = new Uint8Array(N); // 1 = can steer into the logo, 0 = permanent background grain

  const CX = 0.5, CY = 0.5; // Logo's geometric center, used as the breathing pivot

  function size() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(1, window.innerWidth * dpr);
    H = Math.max(1, window.innerHeight * dpr);
    cv.width = W; cv.height = H;
    generateTargets();
  }

  function initParticles() {
    for(let i = 0; i < N; i++) {
      px[i] = Math.random();
      py[i] = Math.random();
      vx[i] = 0;
      vy[i] = 0;
      pz[i] = 0.6 + Math.random() * 0.9; // Depth compressed to range 0.6 - 1.5
      isLogo[i] = i % 2; // Exact 50/50 split between logo-forming and permanent-background particles
    }
  }

  function generateTargets() {
    const lines = 4;
    for(let i = 0; i < N; i++) {
      const lineNum = Math.floor(Math.random() * lines) + 1;
      const p = Math.random();
      const padX = 0.15;
      const width = 0.7;
      lx[i] = padX + (width * p);
      const env = Math.sin(Math.PI * p);
      const rowBase = 0.35 + (0.3 / (lines - 1)) * (lineNum - 1);
      const amp = 0.08 / lines;
      ly[i] = rowBase + Math.sin(lineNum * Math.PI * p * 2) * amp * env;
    }
  }

  window.addEventListener('resize', size);
  initParticles();
  size();

  // State Machine — ultra-slow cinematic pacing (seconds)
  const DURATIONS = { CHAOS: 15, FORMING: 15, HOLD: 8, DISSOLVING: 12 };
  let time = 0;      // Free-running clock, drives the smoke currents and the breathing pulse
  let stateTime = 0;
  let currentState = 'CHAOS'; // CHAOS, FORMING, HOLD, DISSOLVING
  let formationLerp = 0; // 0 = full chaos, 1 = perfectly formed — drives steering AND color

  function updateState() {
    stateTime += 0.016; // Approx 60fps delta

    if (currentState === 'CHAOS') {
      formationLerp = 0;
      if (stateTime > DURATIONS.CHAOS) { currentState = 'FORMING'; stateTime = 0; }
    }
    else if (currentState === 'FORMING') {
      let t = Math.min(1, stateTime / DURATIONS.FORMING);
      formationLerp = t * t * (3 - 2 * t); // Smoothstep ease, spread across the full 15s
      if (stateTime > DURATIONS.FORMING) { currentState = 'HOLD'; stateTime = 0; formationLerp = 1; }
    }
    else if (currentState === 'HOLD') {
      formationLerp = 1;
      if (stateTime > DURATIONS.HOLD) { currentState = 'DISSOLVING'; stateTime = 0; }
    }
    else if (currentState === 'DISSOLVING') {
      let t = Math.min(1, stateTime / DURATIONS.DISSOLVING);
      formationLerp = 1 - (t * t * (3 - 2 * t)); // Fades color and steering back out together
      if (stateTime > DURATIONS.DISSOLVING) { currentState = 'CHAOS'; stateTime = 0; formationLerp = 0; }
    }
  }

  function loop() {
    time += 0.016;
    updateState();

    // Background fade uses normal (non-additive) compositing so it stays a flat, even dim
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(8, 11, 20, 0.45)';
    ctx.fillRect(0, 0, W, H);

    // Additive blending: overlapping particles physically sum their light,
    // so the logo's intersecting points burn brighter than any single grain
    ctx.globalCompositeOperation = 'lighter';

    // Global color: dark grey/blue --grain (124,133,152) -> vibrant --pink (255,42,122)
    const r = Math.floor(124 + (255 - 124) * formationLerp);
    const g = Math.floor(133 + (42 - 133) * formationLerp);
    const b = Math.floor(152 + (122 - 152) * formationLerp);
    ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;

    const flowStrength = 0.00006; // Wide, low-frequency current — thick smoke, not jitter
    const friction = 0.95;
    const steerForce = 0.0025;    // Extremely gentle — logo particles drift into place, never sprint
    const baseSize = 0.6; // Shrunk for micro-grain texture
    const baseAlpha = 0.5;

    // The formed logo breathes gently during HOLD: target coords pulse +/-2.5% around center
    const breathScale = (currentState === 'HOLD')
      ? 1 + 0.025 * Math.sin(time * 0.6)
      : 1;

    for(let i = 0; i < N; i++) {
      // Ethereal smoke current: a wide, slow-moving trigonometric flow field
      const angle = Math.sin(px[i] * 2.2 + time * 0.15) + Math.cos(py[i] * 2.2 - time * 0.12);
      const flowVx = Math.cos(angle) * flowStrength;
      const flowVy = Math.sin(angle) * flowStrength;

      if (isLogo[i] && formationLerp > 0) {
        // Steer toward the breathing target; smoke current fades out as the shape resolves
        const tx = CX + (lx[i] - CX) * breathScale;
        const ty = CY + (ly[i] - CY) * breathScale;
        const steerVx = (tx - px[i]) * steerForce;
        const steerVy = (ty - py[i]) * steerForce;
        vx[i] += flowVx * (1 - formationLerp) + steerVx * formationLerp;
        vy[i] += flowVy * (1 - formationLerp) + steerVy * formationLerp;
      } else {
        // Background particles (and logo particles still in CHAOS) just ride the current
        vx[i] += flowVx;
        vy[i] += flowVy;
      }

      vx[i] *= friction;
      vy[i] *= friction;

      // Depth parallax: close particles (low z) move faster, far particles (high z) crawl
      px[i] += vx[i] / pz[i];
      py[i] += vy[i] / pz[i];

      // Seamless wrap keeps the dust cloud covering 100% of the screen at all times
      if(px[i] < 0) px[i] += 1; else if (px[i] > 1) px[i] -= 1;
      if(py[i] < 0) py[i] += 1; else if (py[i] > 1) py[i] -= 1;

      // Depth parallax: close particles are larger and brighter, far ones smaller and dimmer
      ctx.globalAlpha = Math.min(1, baseAlpha / pz[i]);
      const s = Math.max(0.5, (baseSize / pz[i]) * dpr); // Sub-pixel rendering permitted
      ctx.fillRect(px[i] * W, py[i] * H, s, s);
    }

    ctx.globalAlpha = 1;
    requestAnimationFrame(loop);
  }

  loop();
</script>
</body>
</html>
